<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#5AC8FA"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Hard drive with upward arrow -->
  <g transform="translate(16,16)">
    <!-- Drive body -->
    <rect x="-9" y="0" width="18" height="8" rx="2" fill="white" opacity="0.95"/>
    <!-- Drive indicator dot -->
    <circle cx="5.5" cy="4" r="1.3" fill="#007AFF"/>
    <!-- Drive line -->
    <line x1="-5" y1="4" x2="2" y2="4" stroke="#007AFF" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <!-- Upward arrow -->
    <line x1="0" y1="-2" x2="0" y2="-10" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <polyline points="-4,-6 0,-10 4,-6" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
